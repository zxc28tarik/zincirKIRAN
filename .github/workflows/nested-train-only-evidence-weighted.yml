name: Nested Train Only Evidence Weighted Composite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  nested-evidence-weighted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3"
      - name: Run nested train-only evidence-weighted composite
        run: python scripts/run_nested_train_only_evidence_weighted_composite.py
      - uses: actions/upload-artifact@v4
        with:
          name: nested-train-only-evidence-weighted-v1
          path: research/evidence_runs/nested_train_only_evidence_weighted_composite_v1.json
          if-no-files-found: error
