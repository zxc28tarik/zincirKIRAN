name: Freeze Pre-2021 Price Extension

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/freeze_pre2021_price_extension.py"
      - "research/preregistrations/pre2021_price_extension_freeze_v1.json"
      - "docs/PRE2021_PRICE_EXTENSION_FREEZE.md"
      - ".github/workflows/freeze-pre2021-price-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-pre2021-price-extension:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned freeze dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3" "yfinance==0.2.66"
      - name: Freeze historical price extension and run coverage gate
        run: python scripts/freeze_pre2021_price_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: pre2021-price-extension-v1
          path: data/research_sources/pre2021_price_extension_v1/
          if-no-files-found: error
      - name: Persist frozen package on PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_sources/pre2021_price_extension_v1/
          if git diff --cached --quiet; then
            echo "Frozen package unchanged."
            exit 0
          fi
          git commit -m "Implementation 42C: freeze pre-2021 price package"
          git push origin "HEAD:${HEAD_REF}"
