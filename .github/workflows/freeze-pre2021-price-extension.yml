name: Verify Frozen Pre-2021 Price Extension

on:
  pull_request:
    branches: [main]
    paths:
      - "data/research_sources/pre2021_price_extension_v1/**"
      - "scripts/verify_pre2021_price_extension_freeze.py"
      - "research/preregistrations/pre2021_price_extension_freeze_v1.json"
      - "docs/PRE2021_PRICE_EXTENSION_FREEZE.md"
      - ".github/workflows/freeze-pre2021-price-extension.yml"
  workflow_dispatch:

jobs:
  verify-pre2021-price-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned verification dependency
        run: python -m pip install "pandas==2.2.3"
      - name: Verify immutable frozen package
        run: python scripts/verify_pre2021_price_extension_freeze.py
