name: First Equal Weight Multifactor Challenger

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ew5-challenger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3"
      - name: Run preregistered EW5 challenger
        run: python scripts/run_first_equal_weight_multifactor_challenger.py
      - uses: actions/upload-artifact@v4
        with:
          name: first-equal-weight-multifactor-challenger-v1
          path: research/evidence_runs/first_equal_weight_multifactor_challenger_v1.json
          if-no-files-found: error
