name: Pre-2021 Coverage Power Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pre2021-coverage-power-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned audit dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3" "yfinance==0.2.66"
      - name: Run pre-2021 market/fundamental coverage and H252 power audit
        run: python scripts/run_pre2021_coverage_power_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: pre2021-coverage-power-audit-v1
          path: research/evidence_runs/pre2021_coverage_power_audit_v1.json
          if-no-files-found: error
