name: Real Sector Neutral De-correlation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sector-neutral-decorrelation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3"
      - name: Run real sector-neutral de-correlation diagnostic
        run: python scripts/run_real_sector_neutral_decorrelation.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-sector-neutral-decorrelation-v1
          path: research/evidence_runs/real_sector_neutral_decorrelation_diagnostic_v1.json
          if-no-files-found: error
