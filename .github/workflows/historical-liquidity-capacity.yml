name: Historical Liquidity Capacity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  historical-liquidity-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3"
      - name: Run historical liquidity / capacity diagnostic
        run: python scripts/run_historical_liquidity_capacity.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-liquidity-capacity-v1
          path: research/evidence_runs/historical_liquidity_capacity_v1.json
          if-no-files-found: error
