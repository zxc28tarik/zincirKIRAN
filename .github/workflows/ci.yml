name: CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zincir_kiran
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zincir_kiran"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: zincir_kiran

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Apply PIT PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/pit_core.sql

      - name: Verify PIT PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/pit_schema_smoke.sql
