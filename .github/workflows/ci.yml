name: CI

on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zincir_kiran
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zincir_kiran"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: zincir_kiran

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Apply PIT PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/pit_core.sql

      - name: Apply Accounting & Sector PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/accounting_sector.sql

      - name: Apply Baselines PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/baselines.sql

      - name: Apply Factor Library PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/factor_library.sql

      - name: Apply Factor Lab PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/factor_lab.sql

      - name: Apply De-correlation PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/decorrelation.sql

      - name: Apply Interpretable Alpha PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/interpretable_alpha.sql

      - name: Apply Dynamic Evidence PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/dynamic_evidence.sql

      - name: Apply Context Research PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/context_research.sql

      - name: Apply Confidence PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/confidence.sql

      - name: Apply Portfolio PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/portfolio.sql

      - name: Apply Tournament PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/tournament.sql

      - name: Apply ML Challenger PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/ml_challenger.sql

      - name: Apply Shadow PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/shadow.sql

      - name: Apply Production Gate PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/production_gate.sql

      - name: Apply Evidence Phase PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/evidence_phase.sql

      - name: Apply Official Acquisition PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/official_acquisition.sql

      - name: Apply Procurement PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/procurement.sql

      - name: Apply Cross-Project Bridge PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/cross_project_bridge.sql

      - name: Apply Market Bootstrap PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/market_bootstrap.sql

      - name: Apply KAP Bulk Bootstrap PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/kap_bulk_bootstrap.sql

      - name: Apply Current Bootstrap PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/current_bootstrap.sql

      - name: Apply Financial Versions PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/financial_versions.sql

      - name: Apply InvestingPro Acquisition PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/investingpro_acquisition.sql

      - name: Apply Experimental Semantic Bootstrap PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/experimental_semantic_bootstrap.sql

      - name: Apply Experimental Factor Dataset PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/schemas/experimental_dataset.sql

      - name: Verify PIT PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/pit_schema_smoke.sql

      - name: Verify Accounting & Sector PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/accounting_sector_smoke.sql

      - name: Verify Baselines PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/baselines_smoke.sql

      - name: Verify Factor Library PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/factor_library_smoke.sql

      - name: Verify Factor Lab PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/factor_lab_smoke.sql

      - name: Verify De-correlation PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/decorrelation_smoke.sql

      - name: Verify Interpretable Alpha PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/interpretable_alpha_smoke.sql

      - name: Verify Dynamic Evidence PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/dynamic_evidence_smoke.sql

      - name: Verify Context Research PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/context_research_smoke.sql

      - name: Verify Confidence PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/confidence_smoke.sql

      - name: Verify Portfolio PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/portfolio_smoke.sql

      - name: Verify Tournament PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/tournament_smoke.sql

      - name: Verify ML Challenger PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/ml_challenger_smoke.sql

      - name: Verify Shadow PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/shadow_smoke.sql

      - name: Verify Production Gate PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/production_gate_smoke.sql

      - name: Verify Evidence Phase PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/evidence_phase_smoke.sql

      - name: Verify Official Acquisition PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/official_acquisition_smoke.sql

      - name: Verify Procurement PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/procurement_smoke.sql

      - name: Verify Cross-Project Bridge PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/cross_project_bridge_smoke.sql

      - name: Verify Market Bootstrap PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/market_bootstrap_smoke.sql

      - name: Verify KAP Bulk Bootstrap PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/kap_bulk_bootstrap_smoke.sql

      - name: Verify Current Bootstrap PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/current_bootstrap_smoke.sql

      - name: Verify Financial Versions PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/financial_versions_smoke.sql

      - name: Verify InvestingPro Acquisition PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/investingpro_acquisition_smoke.sql

      - name: Verify Experimental Semantic Bootstrap PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/experimental_semantic_bootstrap_smoke.sql

      - name: Verify Experimental Factor Dataset PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/experimental_dataset_smoke.sql

      - name: Verify database rejection guards
        run: |
          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_duplicate_financial_fact.sql; then
            echo "Duplicate financial fact was incorrectly accepted"
            exit 1
          else
            echo "Duplicate financial fact correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_free_float.sql; then
            echo "Invalid free-float ratio was incorrectly accepted"
            exit 1
          else
            echo "Invalid free-float ratio correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_duplicate_raw_record.sql; then
            echo "Duplicate raw record was incorrectly accepted"
            exit 1
          else
            echo "Duplicate raw record correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_applicability.sql; then
            echo "Invalid applicability state was incorrectly accepted"
            exit 1
          else
            echo "Invalid applicability state correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_restatement.sql; then
            echo "Invalid restatement state was incorrectly accepted"
            exit 1
          else
            echo "Invalid restatement state correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_baseline_mutation.sql; then
            echo "Baseline definition mutation was incorrectly accepted"
            exit 1
          else
            echo "Baseline definition mutation correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_baseline_horizon.sql; then
            echo "Invalid baseline horizon was incorrectly accepted"
            exit 1
          else
            echo "Invalid baseline horizon correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_missing_baseline_metadata.sql; then
            echo "Missing baseline run metadata was incorrectly accepted"
            exit 1
          else
            echo "Missing baseline run metadata correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_factor_premature_stage.sql; then
            echo "Premature factor promotion was incorrectly accepted"
            exit 1
          else
            echo "Premature factor promotion correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_factor_mutation.sql; then
            echo "Factor definition mutation was incorrectly accepted"
            exit 1
          else
            echo "Factor definition mutation correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_factor_empty_fields.sql; then
            echo "Factor with empty required fields was incorrectly accepted"
            exit 1
          else
            echo "Factor with empty required fields correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_factor_experiment_mutation.sql; then
            echo "Experiment protocol mutation was incorrectly accepted"
            exit 1
          else
            echo "Experiment protocol mutation correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_unregistered_factor_result.sql; then
            echo "Unregistered experiment result was incorrectly accepted"
            exit 1
          else
            echo "Unregistered experiment result correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_factor_result.sql; then
            echo "Invalid factor result was incorrectly accepted"
            exit 1
          else
            echo "Invalid factor result correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_decorrelation_run_mutation.sql; then
            echo "De-correlation run mutation was incorrectly accepted"
            exit 1
          else
            echo "De-correlation run mutation correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_decorrelation_pair.sql; then
            echo "Invalid de-correlation pair evidence was incorrectly accepted"
            exit 1
          else
            echo "Invalid de-correlation pair evidence correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_unregistered_decorrelation_result.sql; then
            echo "Unregistered de-correlation result was incorrectly accepted"
            exit 1
          else
            echo "Unregistered de-correlation result correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_residualization_result.sql; then
            echo "Invalid residualization result was incorrectly accepted"
            exit 1
          else
            echo "Invalid residualization result correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_alpha_aggregation_mutation.sql; then
            echo "Alpha aggregation mutation was incorrectly accepted"
            exit 1
          else
            echo "Alpha aggregation mutation correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_alpha_aggregation.sql; then
            echo "Invalid alpha aggregation metadata was incorrectly accepted"
            exit 1
          else
            echo "Invalid alpha aggregation metadata correctly rejected"
          fi


          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_alpha_admission_provenance.sql; then
            echo "Invalid alpha admission provenance was incorrectly accepted"
            exit 1
          else
            echo "Invalid alpha admission provenance correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_duplicate_alpha_component_weight.sql; then
            echo "Duplicate de-correlation component vote was incorrectly accepted"
            exit 1
          else
            echo "Duplicate de-correlation component vote correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_alpha_run.sql; then
            echo "Inconsistent alpha run was incorrectly accepted"
            exit 1
          else
            echo "Inconsistent alpha run correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_alpha_contribution.sql; then
            echo "Invalid alpha contribution was incorrectly accepted"
            exit 1
          else
            echo "Invalid alpha contribution correctly rejected"
          fi


          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_alpha_eligibility.sql; then
            echo "Invalid alpha eligibility was incorrectly accepted"
            exit 1
          else
            echo "Invalid alpha eligibility correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_incomplete_alpha_run.sql; then
            echo "Incomplete alpha run was incorrectly accepted"
            exit 1
          else
            echo "Incomplete alpha run correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_alpha_weight_mutation.sql; then
            echo "Alpha weight mutation was incorrectly accepted"
            exit 1
          else
            echo "Alpha weight mutation correctly rejected"
          fi


          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_dynamic_weighting_mutation.sql; then
            echo "Dynamic weighting mutation was incorrectly accepted"
            exit 1
          else
            echo "Dynamic weighting mutation correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_dynamic_weighting_promotion.sql; then
            echo "Dynamic weighting production promotion was incorrectly accepted"
            exit 1
          else
            echo "Dynamic weighting production promotion correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_future_dynamic_evidence.sql; then
            echo "Future dynamic evidence was incorrectly accepted"
            exit 1
          else
            echo "Future dynamic evidence correctly rejected"
          fi


          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_stale_dynamic_result.sql; then
            echo "Stale dynamic evidence incorrectly produced a factor result"
            exit 1
          else
            echo "Stale dynamic evidence correctly rejected from resolved path"
          fi


          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_late_preregistered_dynamic_run.sql; then
            echo "Post-hoc dynamic weighting protocol was incorrectly accepted"
            exit 1
          else
            echo "Post-hoc dynamic weighting protocol correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_dynamic_protocol_mismatch.sql; then
            echo "Dynamic evidence protocol mismatch was incorrectly accepted"
            exit 1
          else
            echo "Dynamic evidence protocol mismatch correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_dynamic_metric.sql; then
            echo "Invalid dynamic metric provenance was incorrectly accepted"
            exit 1
          else
            echo "Invalid dynamic metric provenance correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_invalid_dynamic_arithmetic.sql; then
            echo "Invalid dynamic evidence arithmetic was incorrectly accepted"
            exit 1
          else
            echo "Invalid dynamic evidence arithmetic correctly rejected"
          fi

          if psql -v ON_ERROR_STOP=1 -f tests/sql/reject_incomplete_dynamic_plan.sql; then
            echo "Incomplete resolved dynamic plan was incorrectly accepted"
            exit 1
          else
            echo "Incomplete resolved dynamic plan correctly rejected"
          fi

      - name: Verify context research rejection guards
        run: bash tests/sql/run_context_rejection_guards.sh

      - name: Verify confidence rejection guards
        run: bash tests/sql/run_confidence_rejection_guards.sh

      - name: Verify portfolio rejection guards
        run: bash tests/sql/run_portfolio_rejection_guards.sh

      - name: Verify tournament rejection guards
        run: bash tests/sql/run_tournament_rejection_guards.sh

      - name: Verify ML Challenger rejection guards
        run: bash tests/sql/run_ml_challenger_rejection_guards.sh

      - name: Verify Shadow rejection guards
        run: bash tests/sql/run_shadow_rejection_guards.sh

      - name: Verify Production Gate rejection guards
        run: bash tests/sql/run_production_gate_rejection_guards.sh

      - name: Verify Evidence Phase rejection guards
        run: bash tests/sql/run_evidence_phase_rejection_guards.sh

      - name: Verify Official Acquisition rejection guards
        run: bash tests/sql/run_official_acquisition_rejection_guards.sh

      - name: Verify Procurement rejection guards
        run: bash tests/sql/run_procurement_rejection_guards.sh

      - name: Verify Cross-Project Bridge rejection guards
        run: bash tests/sql/run_cross_project_rejection_guards.sh

      - name: Verify Market Bootstrap rejection guards
        run: bash tests/sql/run_market_bootstrap_rejection_guards.sh

      - name: Verify KAP Bulk Bootstrap rejection guards
        run: bash tests/sql/run_kap_bulk_bootstrap_rejection_guards.sh

      - name: Verify Current Bootstrap rejection guards
        run: bash tests/sql/run_current_bootstrap_rejection_guards.sh

      - name: Verify Financial Version rejection guards
        run: bash tests/sql/run_financial_version_rejection_guards.sh

      - name: Verify InvestingPro rejection guards
        run: bash tests/sql/run_investingpro_rejection_guards.sh

      - name: Verify Experimental Semantic rejection guards
        run: bash tests/sql/run_experimental_semantic_rejection_guards.sh

      - name: Verify Experimental Factor Dataset rejection guards
        run: bash tests/sql/run_experimental_dataset_rejection_guards.sh
