name: Winsor Outlier Robustness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  winsor-outlier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3"
      - name: Run winsorization / outlier robustness diagnostic
        run: python scripts/run_winsor_outlier_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: winsor-outlier-robustness-v1
          path: research/evidence_runs/winsor_outlier_robustness_v1.json
          if-no-files-found: error
