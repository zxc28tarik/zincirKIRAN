name: Accounting Regime Subperiod Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  accounting-regime-subperiod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3"
      - name: Run accounting-regime subperiod diagnostic
        run: python scripts/run_accounting_regime_subperiod_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-regime-subperiod-v1
          path: research/evidence_runs/accounting_regime_subperiod_diagnostic_v1.json
          if-no-files-found: error
