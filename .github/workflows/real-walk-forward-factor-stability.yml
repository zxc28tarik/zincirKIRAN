name: Real Walk Forward Factor Stability

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  walk-forward-factor-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install diagnostic dependencies
        run: python -m pip install "numpy==1.26.4" "pandas==2.2.3"
      - name: Run real walk-forward factor stability diagnostic
        run: python scripts/run_real_walk_forward_factor_stability.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-walk-forward-factor-stability-v1
          path: research/evidence_runs/real_walk_forward_factor_stability_v1.json
          if-no-files-found: error
