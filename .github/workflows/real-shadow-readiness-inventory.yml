name: Real Shadow Readiness Inventory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  real-shadow-readiness-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build fail-closed real shadow readiness inventory
        run: python scripts/run_real_shadow_readiness_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-shadow-readiness-inventory-v1
          path: research/evidence_runs/real_shadow_readiness_inventory_v1.json
          if-no-files-found: error
